[project]
name = "logiclm"
version = "0.1.0"
description = "Logic-LM: Empowering LLMs with symbolic solvers for faithful logical reasoning (from-scratch reimplementation)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyarrow>=25.0.0",
    "z3-solver>=4.13",
]

[project.optional-dependencies]
llm = [
    "openai>=1.30",
    "anthropic>=0.30",
    "httpx>=0.27",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
logiclm = "logiclm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["logiclm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: tests that download real datasets (disabled by default)",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
